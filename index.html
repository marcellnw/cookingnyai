<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookingnyai — Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --maroon: #800000;
      --light-maroon: #a52a2a;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-color: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden; /* Mencegah scroll yang tidak perlu */
    }

    body {
      background-color: #000;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.5s ease;
    }

    /* Video Background */
    #bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -2;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
      transition: background 0.5s ease;
    }

    .content-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1;
    }

    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      padding: 40px 25px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      animation: fadeIn 1s ease-out;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }

    .theme-toggle:hover { background: rgba(255,255,255,0.2); }

    .profile-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--maroon);
      margin-bottom: 15px;
      box-shadow: 0 0 20px rgba(128, 0, 0, 0.5);
      animation: logoPulse 3s infinite ease-in-out;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    h1 { font-size: 24px; font-weight: 600; margin-bottom: 5px; }
    p.bio { margin-bottom: 25px; font-size: 14px; opacity: 0.9; }

    .grid-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: var(--maroon);
      color: white;
      border-radius: 12px;
      padding: 12px 10px;
      font-weight: 600;
      transition: 0.3s;
      font-size: 13px;
    }

    .link:hover {
      transform: translateY(-3px);
      background: var(--light-maroon);
      box-shadow: 0 5px 15px rgba(128, 0, 0, 0.4);
    }

    .full-link { grid-column: span 2; }

    .link img {
      width: 18px;
      margin-right: 8px;
      filter: brightness(0) invert(1);
    }

    footer {
      margin-top: 25px;
      font-size: 10px;
      opacity: 0.7;
      letter-spacing: 1px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <video autoplay muted loop playsinline id="bg-video">
    <source src="https://raw.githubusercontent.com/marcellnw/cookingnyai/main/lv_0_20251218204337.mp4" type="video/mp4">
  </video>
  
  <div class="overlay"></div>

  <div class="content-wrapper">
    <div class="container">
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
      
      <img class="profile-img" src="https://raw.githubusercontent.com/marcellnw/cookingnyai/main/IMG-20251218-WA0070.jpg" alt="Logo Cookingnyai" />
      
      <h1>Cookingnyai</h1>
      <p class="bio">Resep Khas Jambi & Masakan Harian</p>

      <div class="grid-links">
        <a class="link" href="https://tiktok.com/@cookingnyai__" target="_blank">
          <img src="https://img.icons8.com/ios-filled/50/ffffff/tiktok--v1.png"/> TikTok
        </a>
        <a class="link" href="https://www.facebook.com/share/17upykpc1f/" target="_blank">
          <img src="https://img.icons8.com/ios-filled/50/ffffff/facebook-new.png"/> Facebook
        </a>
        
        <a class="link full-link" href="resep.html">
          <img src="https://img.icons8.com/ios-filled/50/ffffff/restaurant.png"/> Resep Khas Jambi
        </a>
        
        <a class="link full-link" href="#">
          <img src="https://img.icons8.com/ios-filled/50/ffffff/shopping-cart.png"/> Belanja Peralatan Masak
        </a>
      </div>

      <footer>
        &copy; 2025 <strong>Cookingnyai</strong><br>Dari Jambi Untuk Nusantara
      </footer>
    </div>
  </div>

  <script>
    function toggleTheme() {
      const body = document.body;
      const overlay = document.querySelector('.overlay');
      const btn = document.getElementById('themeBtn');
      
      if (body.style.backgroundColor === 'white') {
        body.style.backgroundColor = 'black';
        body.style.color = 'white';
        overlay.style.background = 'rgba(0,0,0,0.6)';
        btn.innerHTML = '🌙';
      } else {
        body.style.backgroundColor = 'white';
        body.style.color = '#333';
        overlay.style.background = 'rgba(255,255,255,0.3)';
        btn.innerHTML = '☀️';
      }
    }
  </script>
</body>
</html>
