<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookingnyai — Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
    }
    html, body {
      height: 100%;
      overflow-x: hidden;
    }
    body {
      background-color: #f9f9f9;
      color: #333;
    }
    .dark-mode body {
      background-color: #1a1a1a;
      color: #eee;
    }
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -2;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.4);
      z-index: -1;
      transition: background 0.3s ease;
    }
    .dark-mode .overlay {
      background: rgba(0, 0, 0, 0.7);
    }
    .content-wrapper {
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 30px 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      animation: fadeIn 1.2s ease-in-out;
      margin-bottom: 30px;
      position: relative;
    }
    .dark-mode .container {
      background: rgba(40, 40, 40, 0.7);
    }
    .theme-toggle {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
    }
    .profile-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #4CAF50;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #2E7D32; /* Hijau Masak */
    }
    .dark-mode h1 {
      color: #81C784;
    }
    p.bio {
      margin: 6px 0 20px;
      font-size: 14px;
      color: #555;
      font-weight: 500;
    }
    .dark-mode p.bio {
      color: #ccc;
    }
    .grid-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: white;
      color: #2E7D32;
      border-radius: 20px;
      padding: 12px 10px;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease, background 0.3s ease;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .link:hover {
      transform: translateY(-3px);
      background: #E8F5E9;
    }
    .dark-mode .link {
      background: #333;
      color: #81C784;
    }
    .dark-mode .link:hover {
      background: #444;
    }
    .link img {
      width: 20px;
      margin-right: 8px;
    }
    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
    @media (max-width: 480px) {
      .content-wrapper { padding: 16px; }
      .container { padding: 25px 15px; }
    }
  </style>
</head>
<body>
  <video autoplay muted loop id="bg-video">
    <source src="https://assets.mixkit.co/videos/preview/mixkit-fresh-vegetables-in-a-pan-40543-large.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <audio id="bgm" autoplay loop hidden>
    <source src="https://www.bensound.com/bensound-music/bensound-buddy.mp3" type="audio/mpeg">
  </audio>

  <div class="content-wrapper">
    <div class="container">
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      
      <img class="profile-img" src="https://ui-avatars.com/api/?name=Cooking+Nyai&background=4CAF50&color=fff&size=128" alt="Cookingnyai" />
      
      <h1>Cookingnyai</h1>
      <p class="bio">Resep Masakan Harian | Tips Dapur | Food Enthusiast</p>

      <div class="grid-links">
        <a class="link" href="https://tiktok.com/@cookingnyai__" target="_blank">
          <img src="https://img.icons8.com/ios-filled/50/2E7D32/tiktok--v1.png"/> TikTok
        </a>
        <a class="link" href="https://www.facebook.com/share/17upykpc1f/" target="_blank">
          <img src="https://img.icons8.com/ios-filled/50/2E7D32/facebook-new.png"/> Facebook
        </a>
      </div>

      <a class="link" href="#" target="_blank">
        <img src="https://img.icons8.com/ios-filled/50/2E7D32/restaurant.png"/> Kumpulan Resep
      </a>
      
      <a class="link" href="#" target="_blank">
        <img src="https://img.icons8.com/ios-filled/50/2E7D32/shopping-cart.png"/> Rekomendasi Alat Masak
      </a>

      <footer>
        &copy; 2025 <strong>Cookingnyai</strong> | Inspirasi Masak Setiap Hari.
      </footer>
    </div>
  </div>

  <script>
    // Memutar musik setelah interaksi pertama
    window.addEventListener("click", function () {
      const bgm = document.getElementById("bgm");
      if (bgm && bgm.paused) {
        bgm.play().catch(() => {});
      }
    }, { once: true });

    function toggleTheme() {
      document.documentElement.classList.toggle('dark-mode');
      const btn = document.querySelector('.theme-toggle');
      btn.textContent = document.documentElement.classList.contains('dark-mode') ? '☀️' : '🌙';
    }
  </script>
</body>
</html>
